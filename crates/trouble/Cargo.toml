[package]
name = "trouble"
version = "0.1.0"
edition = "2021"
publish = false

# 口 (`router`)・入力の検証・SQL を持ち、native でも wasm32-unknown-unknown でもビルドできる
# (接続は持たない。張るのは直下の worker と tests/)。
[dependencies]
# 出どころは直下の Cargo.toml の [workspace.dependencies] の 1 か所 (ここに git / path を書かない)
alc-core-wasm = { workspace = true }
alc-worker-db = { workspace = true }
# multipart は添付の口 (rust と同じ axum の Multipart。multer は pure Rust で wasm32 でもビルドできる)
axum = { version = "0.8", default-features = false, features = ["json", "multipart", "query"] }
# 行の created_at / updated_at (rust-alc-api と同じ chrono の JSON の形)。
# alloc は CSV の発生日の `format("%Y-%m-%d")` (rust と同じ書き方) に要る。
# clock は予約の時刻の検証の `Utc::now()` (rust と同じ。wasm32 では wasmbind が JS の Date から読む)
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde", "clock", "wasmbind"] }
# チケットの CSV (rust の export_csv と同じ csv crate で、同じエスケープ)。pure Rust
csv = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 型付きの文の型 (`Type`) と列の型 (uuid・timestamptz・jsonb)。接続は張らない
# (wasm 用の feature `js` は直下の worker と alc-worker-db が付ける)
tokio-postgres = { version = "0.7", default-features = false, features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
# tests/ の実 DB の接続 (runtime 付き)。dev-dependency なので wasm のビルドには入らない
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
